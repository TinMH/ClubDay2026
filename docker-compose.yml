services:
  club-day:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: club-day

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      MODEL_OFFLINE: 1

    # Snapshot lượt chơi (data/rounds.json) phải sống ngoài container.
    # Không có volume thì `docker compose up --build` hay recreate là mất hết kết
    # quả đã chơi — `restart` thì còn, nhưng rebuild thì không. Server chỉ ghi
    # snapshot lúc thoát và đọc lại lúc khởi động, nên volume là đủ, không cần gì hơn.
    volumes:
      - club-day-data:/app/data

    networks:
      - edge

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"

      - "traefik.http.routers.club-day.rule=Host(`club-day.hcmute-dsc.io.vn`)"
      - "traefik.http.routers.club-day.entrypoints=websecure"
      - "traefik.http.routers.club-day.tls=true"
      - "traefik.http.routers.club-day.tls.certresolver=letsencrypt"

      - "traefik.http.services.club-day.loadbalancer.server.port=8787"

volumes:
  club-day-data:

networks:
  edge:
    external: true